[project]
name = "fastapi-proj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.158.0",
]

[project.scripts]
fastapi-proj = "fastapi_proj:main"

[build-system]
